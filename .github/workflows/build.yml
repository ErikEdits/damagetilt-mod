name: Build DamageTilt Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 1.19.x (Java 17, MatrixStack API, mixin-based tilt suppression) ──
          - mc: "1.19"
            yarn: "1.19+build.4"
            fabric_api: "0.58.0+1.19"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.19"
          - mc: "1.19.1"
            yarn: "1.19.1+build.6"
            fabric_api: "0.58.5+1.19.1"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.19.1"
          - mc: "1.19.2"
            yarn: "1.19.2+build.28"
            fabric_api: "0.77.0+1.19.2"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.19.2"
          - mc: "1.19.3"
            yarn: "1.19.3+build.5"
            fabric_api: "0.76.1+1.19.3"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.19.3"
          - mc: "1.19.4"
            yarn: "1.19.4+build.2"
            fabric_api: "0.87.2+1.19.4"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.19.4"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'
          cache-disabled: true

      - name: 🔨 Build mod (${{ matrix.mc }})
        run: |
          sed -i "s/id 'fabric-loom' version '.*'/id 'fabric-loom' version '${{ matrix.loom }}'/" build.gradle
          gradle remapJar --no-daemon --no-build-cache
        env:
          MC_VERSION: ${{ matrix.mc }}
          YARN_VERSION: ${{ matrix.yarn }}
          FABRIC_API: ${{ matrix.fabric_api }}
          MOD_VERSION: ${{ matrix.mod_version }}

      - name: 📤 Upload JAR (${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: damagetilt-${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
