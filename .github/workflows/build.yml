name: Build DamageTilt Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21"
            yarn: "1.21+build.9"
            fabric_api: "0.102.0+1.21"
            loom: "1.9-SNAPSHOT"
            mod_version: "1.0.0-1.21"
          - mc: "1.21.1"
            yarn: "1.21.1+build.3"
            fabric_api: "0.116.6+1.21.1"
            loom: "1.9-SNAPSHOT"
            mod_version: "1.0.0-1.21.1"
          - mc: "1.21.2"
            yarn: "1.21.2+build.1"
            fabric_api: "0.106.1+1.21.2"
            loom: "1.9-SNAPSHOT"
            mod_version: "1.0.0-1.21.2"
          - mc: "1.21.3"
            yarn: "1.21.3+build.2"
            fabric_api: "0.108.0+1.21.3"
            loom: "1.9-SNAPSHOT"
            mod_version: "1.0.0-1.21.3"
          - mc: "1.21.5"
            yarn: "1.21.5+build.1"
            fabric_api: "0.128.2+1.21.5"
            loom: "1.10-SNAPSHOT"
            mod_version: "1.0.0-1.21.5"
          - mc: "1.21.6"
            yarn: "1.21.6+build.1"
            fabric_api: "0.127.1+1.21.6"
            loom: "1.10-SNAPSHOT"
            mod_version: "1.0.0-1.21.6"
          - mc: "1.21.7"
            yarn: "1.21.7+build.1"
            fabric_api: "0.129.0+1.21.7"
            loom: "1.11-SNAPSHOT"
            mod_version: "1.0.0-1.21.7"
          - mc: "1.21.8"
            yarn: "1.21.8+build.1"
            fabric_api: "0.130.0+1.21.8"
            loom: "1.11-SNAPSHOT"
            mod_version: "1.0.0-1.21.8"
          - mc: "1.21.9"
            yarn: "1.21.9+build.1"
            fabric_api: "0.134.0+1.21.9"
            loom: "1.13-SNAPSHOT"
            mod_version: "1.0.0-1.21.9"
          - mc: "1.21.10"
            yarn: "1.21.10+build.1"
            fabric_api: "0.138.4+1.21.10"
            loom: "1.13-SNAPSHOT"
            mod_version: "1.0.0-1.21.10"
          - mc: "1.21.11"
            yarn: "1.21.11+build.1"
            fabric_api: "0.141.1+1.21.11"
            loom: "1.13-SNAPSHOT"
            mod_version: "1.0.0-1.21.11"

    steps:
      - name: 📥 Code herunterladen
        uses: actions/checkout@v4

      - name: ☕ Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🔧 Gradle einrichten
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: 🔨 Mod bauen (${{ matrix.mc }})
        run: gradle remapJar --no-daemon
        env:
          MC_VERSION: ${{ matrix.mc }}
          YARN_VERSION: ${{ matrix.yarn }}
          FABRIC_API: ${{ matrix.fabric_api }}
          LOOM_VERSION: ${{ matrix.loom }}
          MOD_VERSION: ${{ matrix.mod_version }}

      - name: 📤 JAR hochladen (${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: damagetilt-${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
