name: Build DamageTilt Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 1.20.x (Java 17, mixin-based tilt suppression) ──────────────────
          - mc: "1.20"
            yarn: "1.20+build.1"
            fabric_api: "0.83.0+1.20"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.20"
          - mc: "1.20.1"
            yarn: "1.20.1+build.10"
            fabric_api: "0.92.9+1.20.1"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.20.1"
          - mc: "1.20.2"
            yarn: "1.20.2+build.4"
            fabric_api: "0.91.6+1.20.2"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.20.2"
          - mc: "1.20.3"
            yarn: "1.20.3+build.1"
            fabric_api: "0.91.1+1.20.3"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.20.3"
          - mc: "1.20.4"
            yarn: "1.20.4+build.3"
            fabric_api: "0.97.3+1.20.4"
            loom: "1.9-SNAPSHOT"
            java: "17"
            mod_version: "1.0.0-1.20.4"
          # ── 1.20.5-1.20.6 (Java 21, damageTiltStrength available) ────────────
          - mc: "1.20.5"
            yarn: "1.20.5+build.1"
            fabric_api: "0.97.8+1.20.5"
            loom: "1.9-SNAPSHOT"
            java: "21"
            mod_version: "1.0.0-1.20.5"
          - mc: "1.20.6"
            yarn: "1.20.6+build.3"
            fabric_api: "0.100.8+1.20.6"
            loom: "1.9-SNAPSHOT"
            java: "21"
            mod_version: "1.0.0-1.20.6"
          # ── 1.21.x ───────────────────────────────────────────────────────────
          - mc: "1.21"
            yarn: "1.21+build.9"
            fabric_api: "0.102.0+1.21"
            loom: "1.9-SNAPSHOT"
            java: "21"
            mod_version: "1.0.0-1.21"
          - mc: "1.21.1"
            yarn: "1.21.1+build.3"
            fabric_api: "0.116.6+1.21.1"
            loom: "1.9-SNAPSHOT"
            java: "21"
            mod_version: "1.0.0-1.21.1"
          - mc: "1.21.2"
            yarn: "1.21.2+build.1"
            fabric_api: "0.106.1+1.21.2"
            loom: "1.9-SNAPSHOT"
            java: "21"
            mod_version: "1.0.0-1.21.2"
          - mc: "1.21.3"
            yarn: "1.21.3+build.2"
            fabric_api: "0.108.0+1.21.3"
            loom: "1.9-SNAPSHOT"
            java: "21"
            mod_version: "1.0.0-1.21.3"
          - mc: "1.21.4"
            yarn: "1.21.4+build.8"
            fabric_api: "0.119.2+1.21.4"
            loom: "1.9-SNAPSHOT"
            java: "21"
            mod_version: "1.0.0-1.21.4"
          - mc: "1.21.5"
            yarn: "1.21.5+build.1"
            fabric_api: "0.128.2+1.21.5"
            loom: "1.10-SNAPSHOT"
            java: "21"
            mod_version: "1.0.0-1.21.5"
          - mc: "1.21.6"
            yarn: "1.21.6+build.1"
            fabric_api: "0.127.1+1.21.6"
            loom: "1.10-SNAPSHOT"
            java: "21"
            mod_version: "1.0.0-1.21.6"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'
          cache-disabled: true

      - name: 🔨 Build mod (${{ matrix.mc }})
        run: |
          sed -i "s/id 'fabric-loom' version '.*'/id 'fabric-loom' version '${{ matrix.loom }}'/" build.gradle
          gradle remapJar --no-daemon --no-build-cache
        env:
          MC_VERSION: ${{ matrix.mc }}
          YARN_VERSION: ${{ matrix.yarn }}
          FABRIC_API: ${{ matrix.fabric_api }}
          MOD_VERSION: ${{ matrix.mod_version }}

      - name: 📤 Upload JAR (${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: damagetilt-${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
