name: Build DamageTilt Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 1.18.x (Java 17, Gradle 8.14, Loom 1.9, Yarn) ──────────────────────
          - mc: "1.18"
            yarn: "1.18+build.1"
            fabric_api: "0.44.0+1.18"
            loom: "1.9-SNAPSHOT"
            gradle: "8.14"
            java: "17"
            mod_version: "1.1.0-1.18"
          - mc: "1.18.1"
            yarn: "1.18.1+build.22"
            fabric_api: "0.46.6+1.18"
            loom: "1.9-SNAPSHOT"
            gradle: "8.14"
            java: "17"
            mod_version: "1.1.0-1.18.1"
          - mc: "1.18.2"
            yarn: "1.18.2+build.4"
            fabric_api: "0.77.0+1.18.2"
            loom: "1.9-SNAPSHOT"
            gradle: "8.14"
            java: "17"
            mod_version: "1.1.0-1.18.2"

          # ── 1.21.9 – 1.21.11 (Java 21, Gradle 9.2.1, Loom 1.15.5, Yarn) ────────
          - mc: "1.21.9"
            yarn: "1.21.9+build.1"
            fabric_api: "0.134.1+1.21.9"
            loom: "1.15.5"
            gradle: "9.2.1"
            java: "21"
            mod_version: "1.1.0-1.21.9"
          - mc: "1.21.10"
            yarn: "1.21.10+build.3"
            fabric_api: "0.138.4+1.21.10"
            loom: "1.15.5"
            gradle: "9.2.1"
            java: "21"
            mod_version: "1.1.0-1.21.10"
          - mc: "1.21.11"
            yarn: "1.21.11+build.6"
            fabric_api: "0.141.6+1.21.11"
            loom: "1.15.5"
            gradle: "9.2.1"
            java: "21"
            mod_version: "1.1.0-1.21.11"

          # ── 26.x (Java 25, Gradle 9.2.1, Loom 1.15.5, unobfuscated – no Yarn) ──
          - mc: "26.1"
            yarn: ""
            fabric_api: "0.155.3+26.1.2"
            loom: "1.15.5"
            gradle: "9.2.1"
            java: "25"
            mod_version: "1.1.0-26.1"
          - mc: "26.1.1"
            yarn: ""
            fabric_api: "0.155.3+26.1.2"
            loom: "1.15.5"
            gradle: "9.2.1"
            java: "25"
            mod_version: "1.1.0-26.1.1"
          - mc: "26.1.2"
            yarn: ""
            fabric_api: "0.155.3+26.1.2"
            loom: "1.15.5"
            gradle: "9.2.1"
            java: "25"
            mod_version: "1.1.0-26.1.2"
          - mc: "26.2"
            yarn: ""
            fabric_api: "0.161.0+26.2"
            loom: "1.15.5"
            gradle: "9.2.1"
            java: "25"
            mod_version: "1.1.0-26.2"
          - mc: "26.3"
            yarn: ""
            fabric_api: "0.164.0+26.3"
            loom: "1.15.5"
            gradle: "9.2.1"
            java: "25"
            mod_version: "1.1.0-26.3"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: 🔧 Setup Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-disabled: true

      - name: 🔨 Build mod (${{ matrix.mc }})
        run: |
          sed -i "s/id '[a-z.]*fabric-loom' version '.*'/id 'net.fabricmc.fabric-loom' version '${{ matrix.loom }}'/" build.gradle
          gradle build --no-daemon --no-build-cache
        env:
          MC_VERSION: ${{ matrix.mc }}
          YARN_VERSION: ${{ matrix.yarn }}
          FABRIC_API: ${{ matrix.fabric_api }}
          MOD_VERSION: ${{ matrix.mod_version }}

      - name: 📤 Upload JAR (${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: damagetilt-${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  # Collects every version's jar into one artifact, so all jars can be downloaded at once.
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all jars
        uses: actions/download-artifact@v4
        with:
          pattern: damagetilt-*
          path: all-jars
          merge-multiple: true

      - name: 📤 Upload combined jars
        uses: actions/upload-artifact@v4
        with:
          name: damagetilt-all-jars
          path: all-jars/*.jar
          if-no-files-found: error
