plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

// ── Version resolution ──────────────────────────────────────────────────────
def mcVersion   = System.getenv('MC_VERSION')   ?: '1.21.4'
def yarnVersion = System.getenv('YARN_VERSION') ?: '1.21.4+build.1'
def fabricApi   = System.getenv('FABRIC_API')   ?: '0.119.2+1.21.4'

version = System.getenv('MOD_VERSION') ?: '1.0.0'
group   = 'dev.damagetilt'

base { archivesName = 'damagetilt' }

// ── Source variant & Java version ────────────────────────────────────────────
def mcParts = mcVersion.split('\\.')
def mcMajor = Integer.parseInt(mcParts[1])
def mcMinor = mcParts.length > 2 ? Integer.parseInt(mcParts[2]) : 0

String sourceVariant
JavaVersion targetJava
int minJava

if (mcMajor == 18) {
    // 1.18 / 1.18.1 / 1.18.2 – LiteralText (no Text.literal()), old ButtonWidget, MC Quaternion
    sourceVariant = 'v1_18'
    targetJava    = JavaVersion.VERSION_17
    minJava       = 17
} else if (mcMajor == 19 && mcMinor <= 2) {
    // 1.19 / 1.19.1 / 1.19.2 – old ButtonWidget constructor, OrderedText for centered draw
    sourceVariant = 'v1_19_old'
    targetJava    = JavaVersion.VERSION_17
    minJava       = 17
} else if (mcMajor == 19 && mcMinor == 3) {
    // 1.19.3 – ButtonWidget builder; JOML math classes; directional tilt via Camera mixin
    sourceVariant = 'v1_19_mid'
    targetJava    = JavaVersion.VERSION_17
    minJava       = 17
} else if (mcMajor == 19) {
    // 1.19.4 – ButtonWidget builder; JOML; Mojang fixed directional tilt natively → just toggle
    sourceVariant = 'v1_19_new'
    targetJava    = JavaVersion.VERSION_17
    minJava       = 17
} else if (mcMajor == 20 && mcMinor <= 1) {
    // 1.20, 1.20.1 – DrawContext API, no damageTiltStrength
    sourceVariant = 'v1_20_old'
    targetJava    = JavaVersion.VERSION_17
    minJava       = 17
} else if (mcMajor == 20 && mcMinor <= 4) {
    // 1.20.2–1.20.4 – DrawContext API, no damageTiltStrength
    sourceVariant = 'v1_20_mid'
    targetJava    = JavaVersion.VERSION_17
    minJava       = 17
} else {
    // 1.20.5+ / 1.21.x – damageTiltStrength slider available
    sourceVariant = 'v1_20_new'
    targetJava    = JavaVersion.VERSION_21
    minJava       = 21
}

// ── Source sets ──────────────────────────────────────────────────────────────
sourceSets {
    main {
        java      { srcDirs = ['src/main/java', "src/${sourceVariant}/java"] }
        resources { srcDirs = ["src/${sourceVariant}/resources"] }
    }
}

// ── Repositories ─────────────────────────────────────────────────────────────
repositories {
    maven { url 'https://maven.fabricmc.net/' }
}

// ── Dependencies ─────────────────────────────────────────────────────────────
dependencies {
    minecraft         "com.mojang:minecraft:${mcVersion}"
    mappings          "net.fabricmc:yarn:${yarnVersion}:v2"
    modImplementation 'net.fabricmc:fabric-loader:0.16.9'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
}

// ── Resource filtering ───────────────────────────────────────────────────────
processResources {
    inputs.property 'version',   project.version
    inputs.property 'mcVersion', mcVersion
    inputs.property 'minJava',   minJava
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand version: project.version, mcVersion: mcVersion, minJava: minJava
    }
}

// ── Java target ──────────────────────────────────────────────────────────────
java {
    sourceCompatibility = targetJava
    targetCompatibility = targetJava
}
